# config/merge_skeleton_into_books.conf
#
# Defaults for bin/merge_skeleton_into_books.sh (v0.2.0), the rsync wrapper
# that syncs a BooksInput_* staging tree into the Books library.
# Priority: command-line flag > environment variable > this file > built-in default
#
# Environment variable equivalents:
#   MERGE_SOURCE_DIR, MERGE_OUTPUT_DIR, MERGE_TARGET_DIR, MERGE_REPORT_DIR

# Optional explicit staging tree.  When unset (also via SOURCE_DIR here),
# the newest BooksInput_* folder under OUTPUT_DIR is used automatically.
# SOURCE_DIR=

# Discovery root for BooksInput_* folders (used only when SOURCE_DIR is unset).
OUTPUT_DIR=/mnt/c/Backup_Go7

# The Books library (destination wins, never overwritten).
TARGET_DIR=/mnt/c/Backup_Go7/Books

REPORT_DIR=/mnt/c/Backup_Go7/merge-reports